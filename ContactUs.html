<!DOCTYPE html>
<html>
    <head>
        <title>
            Wayfinder Travel
        </title>
        <style>
            header {
                background-color: #2c4a3e;
                padding: 15px 30px;
                display: flex;
                justify-content: space-between;
                align-items: center;
                width: 99;
            }
            .Logo{
               display: flex;
               align-items: center;
               gap:  10px;
            }
            .Logo span{
                font-family:"Gaorgia", serif;
                font-size:30px;
                color: #e2f0d9;
                letter-spacing: 1px;
            }
            /*nav links*/
            header ul{
                display: flex;
                list-style:  none;
                gap: 25px;
                padding:0;
                margin: 0;
            }
            header ul li a {
                text-decoration:none;
                color:#e2f0d9;
                font-size: 16px;
                font-weight: 500;
                gap:30px;
                margin-right: auto;
                
            }
            html{
                scroll-behavior: smooth;
            }
            body{
                margin:0;
                padding:0;
                box-sizing:border-box;
            }
            .search-container {
                display:flex;
                align-items: center;
                background-color:#e2f0d9; 
                border-radius: 20px;
                padding: 6px 15px;
                gap: 8px;
                box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            }
            .search-container input{
                border: none;
                outline: none;
                background: transparent;
                width:240px;
                font-size:14px;
                color: #333;
            }
            .btn{
                padding: 8px 16px;
                border-radius: 20px;
                border: none;
                background-color:#2c4a3e;
                color: #e2f0d9;
                font-family:"Gaorgia", serif;
                cursor: pointer;
                transition: background-color 0.2s ease;
                font-size: 14px;
                white-space: nowrap;
            }
            .btn:hover{
                background-color:#3b6354;
            }
            /*Section home*/
            .home{
                background-image: url('background9.jpg');
                background-repeat: no-repeat;
                background-size: cover;
                background-position: center;
                padding: 0 1px;
                display:flex;
                height:84vh;
                align-items:center;
                padding: 0 40px;
                position: relative;
            }
            .socialIcons{
                display: flex;
                flex-direction: column;
                gap:15px;
                position: absolute;
                left:30px;
            }
            .socialIcons a img{
                display:flex;
                align-items:center;
                justify-content: center;
                width: 40px;
                height: 40px;
                background-color: rgba(44, 74, 62, 0.8);
                color:#e2f0d9;
                text-decoration: none;
                font-weight: bold;
            }
            /*text area*/
            .home-text{
                margin-left:60px;
                max-width:1200px; 
                width:99%;
                display: flex;
                justify-content: space-between;
                align-items: center;
                gap: 50px;
                box-sizing: border-box;
            }
            .home-text div{
                flex: 1;
            }
            .title-box{
                border: none;
                padding:15px 20px;
                background-color: rgba(0, 0, 0, 0.4);
                margin-bottom:20px;
            }
            .title-box h1{
                font-family:"Georgia", serif;
                color:#e2f0d9;
                font-size:36px;
                margin:0;
                letter-spacing:2px;
                white-space: nowrap;
            }
            /*discription*/
            .discription-box{
                border:none;
                padding:15px 20px;
                background-color: rgba(0, 0, 0, 0.4);
                margin-bottom:20px;
            }
            .discription-box p{
                font-family:"Georgia", serif;
                color:#e2f0d9;
                font-size: 15px;
                line-height: 1.6;
                margin: 0;
                margin: bottom 20px;
            }
            .home-text .discription-box:last-child{flex:1;min-width: 400px;}
            .home-text div:first-child{
                flex:1.5;
                min-width: 450px
            }
        </style>
    </head>
    <body>
        <header>
            <div class="Logo">
                <img src="WayfinderLogo.png" alt="Damn logo!" style="width: 80px; height: 80px; vertical-align: middle; margin-right:8px;"/>
                <h1 style="color: #e2f0d9;">Wayfinder Travel</h1>
            </div>
            <!--center part-->
            <nav>
                <ul>
                    <li><a href="travel_recommendation.html">Home</a></li>
                    <li><a href="AboutUS.html">About Us</a></li>
                    <li><a id="contactUs">Contact Us</a></li>
                </ul>
            </nav>
            <nav>
                <div></div>
            </nav>
            <nav>
                <div></div>
            </nav>
        </header>

        <section id="Home" class="home">
            <!--Vertical social media icons-->
            <div class="socialIcons">
                <a href="#"><img src="X.jpg"/></a><br/>
                <a href="#"><img src="facebook.png" /></a><br/>
                <a href="#"><img src="insta.png" /></a><br/>
                <a href="#"><img src="youtube.png" /></a><br/>
            </div>
            <!--Heading and paragraph-->
            <div class="home-text">
                <div>
                    <div class= "title-box">
                        <h1>CONTACT US</h1>
                    </div>
                    <div class="discription-box">
                        <p>Get in touch with our team of pathfinders and explorers.
                        </p>
                    </div>
                </div>
                <!--left form-->
                <div class="discription-box">
                    <form onsubmit="event.preventDefault();" style="display:flex; flex-direction:column; gap: 15px;">
                        <div style="display: flex; flex-direction:column; text-align: left; gap: 5px;">
                            <label for="name" style="color:#e2f0d9; font-family:'Gaorgia',serif; font-size: 14px;">Name</label>
                            <input type="text" id="name" placeholder="Enter your name" required style="background-color: rgba(0, 0, 0, 0.4); border: 1px solid rgba(226, 240, 217, 0.4); border-radius: 8px; padding: 10px; color: #e2f0d9; font-family: 'Georgia', serif; font-size: 14px; outline: none;">
                        </div>
                        <div style="display: flex; flex-direction:column; text-align: left; gap: 5px;">
                            <label for="email" style="color:#e2f0d9; font-family:'Gaorgia',serif; font-size: 14px;">Email</label>
                            <input type="email" id="email" placeholder="Enter your email" required style="background-color: rgba(0, 0, 0, 0.4); border: 1px solid rgba(226, 240, 217, 0.4); border-radius: 8px; padding: 10px; color: #e2f0d9; font-family: 'Georgia', serif; font-size: 14px; outline: none;">
                        </div>
                        <div style="display: flex; flex-direction:column; text-align: left; gap: 5px;">
                            <label for="message" style="color:#e2f0d9; font-family:'Gaorgia',serif; font-size: 14px;">Message</label>
                            <textarea id="message" rows="4" placeholder="Enter your message" required style="background-color: rgba(0, 0, 0, 0.4); border: 1px solid rgba(226, 240, 217, 0.4); border-radius: 8px; padding: 10px; color: #e2f0d9; font-family: 'Georgia', serif; font-size: 14px; outline: none;"></textarea>
                        </div>
                        <!--Submit button-->
                        <button type="submit" id="submitBtn" class="btn" style="align-self: stretch;">Submit</button>
                    </form>
                </div>

            </div>
        </section>
        </body>
</html>
